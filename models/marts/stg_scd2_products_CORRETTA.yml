models:
  - name: stg_scd2_products_corretta
    description: "Modello incrementale che costruisce la dimensione a partire dalle tabelle sorgenti. Tiene traccia delle modifiche ai campi di prodotto."
    columns:
      - name: product_sk
        data_type: varchar
        description: "Chiave surrogata generata con hash dei campi prodotto."
        tests:
          - unique
          - not_null
        tests:
          - unique
          - not_null

      - name: product_cd
        data_type: varchar
        description: "Codice univoco prodotto nella sorgente."
        tests:
          - not_null

      - name: model_name
        data_type: varchar
        description: "Nome del modello del prodotto"

      - name: brand
        data_type: varchar
        description: "Nome del brand del prodotto"

      - name: category
        data_type: varchar
        description: "Categoria del prodotto"

      - name: list_price
        data_type: float
        description: "Prezzo di listino del prodotto"

      - name: color
        data_type: varchar
        description: "Colore del prodotto"

      - name: is_deleted
        data_type: varchar
        description: "Flag che indica se il prodotto è stato eliminato nella sorgente."

      - name: dbt_updated_at
        data_type: timestamp_ltz
        description: "Timestamp ultimo caricamento del record tramite dbt."

      - name: valid_from
        data_type: timestamp_ltz
        description: "Data di inizio validità del record."
        tests:
          - not_null

      - name: valid_to
        data_type: date
        description: "Data fine validità del record."
        tests: 
          - not_null

      - name: is_current
        data_type: boolean
        description: "Flag che indica se il record è l'ultima versione corrente."
        tests:
          - not_null